# Configuración de la corrida local: clase de 40 alumnos.
# Locust lee este archivo automáticamente si corres `locust` desde este directorio.
# Cualquier valor se puede sobreescribir por CLI, p. ej.: locust --host https://...

host = http://localhost:8000

# Ramp-up de 0 a 40 usuarios en ~60 s (40 / 0.67 ≈ 60 s), corrida de 5 minutos
users = 40
spawn-rate = 0.67
run-time = 5m

# Sin interfaz web: imprime stats en consola y genera reportes al terminar
headless = true
html = loadtest_report.html
csv = loadtest
